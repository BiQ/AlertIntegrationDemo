# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: read

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - name: Check for relevant changes
      id: changes
      if: github.event_name != 'workflow_dispatch'
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      with:
        # Compare pushes with the previous branch tip; PRs use GitHub's changed-file list.
        base: ${{ github.event_name == 'push' && github.ref || '' }}
        filters: |
          build:
            - '.github/workflows/dotnet.yml'
            - '.tool-versions'
            - '**/*.cs'
            - '**/*.csproj'
            - '*.sln'
    - name: Skip build for unrelated changes
      if: github.event_name != 'workflow_dispatch' && steps.changes.outputs.build == 'false'
      run: echo "No relevant files changed. Skipping build."
    - name: Setup .NET
      if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.build == 'true'
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        # Kept in sync with .tool-versions by Renovate (see renovate.json)
        # renovate: datasource=dotnet-version depName=dotnet-sdk
        dotnet-version: "11.0.100"
    - name: Restore dependencies
      if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.build == 'true'
      run: dotnet restore
    - name: Build
      if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.build == 'true'
      run: dotnet build --no-restore --warnaserror
